name: TailVNC acquire complete offline build cache

on:
  push:
    branches:
      - tf-tailvnc-offline-cache-20260928

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - name: Materialize exact AVNC source and native donor trees
        shell: bash
        run: |
          set -euo pipefail
          AVNC_SHA=1e209d630d106d1901f6d8bec671da6c41c2f18a
          LIBVNC_SHA=cc4be40b5b5a9327974d1eeb52f445db44abf801
          VCPKG_SHA=e2bafb1c06518df2e996a2028bdea86f9736d5cb
          curl -fL --retry 3 "https://codeload.github.com/gujjwal00/avnc/zip/${AVNC_SHA}" -o avnc.zip
          unzip -q avnc.zip && mv "avnc-${AVNC_SHA}" avnc
          mkdir -p avnc/extern
          curl -fL --retry 3 "https://codeload.github.com/gujjwal00/libvncserver/zip/${LIBVNC_SHA}" -o libvnc.zip
          unzip -q libvnc.zip && rm -rf avnc/extern/libvncserver && mv "libvncserver-${LIBVNC_SHA}" avnc/extern/libvncserver
          curl -fL --retry 3 "https://codeload.github.com/gujjwal00/vcpkg/zip/${VCPKG_SHA}" -o vcpkg.zip
          unzip -q vcpkg.zip && rm -rf avnc/extern/vcpkg && mv "vcpkg-${VCPKG_SHA}" avnc/extern/vcpkg
      - name: Install exact Android SDK requirements
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT" -type f -name sdkmanager -perm -u+x | head -1)"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Build upstream once from a clean dependency home
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://services.gradle.org/distributions/gradle-9.5.0-bin.zip -o gradle.zip
          unzip -q gradle.zip
          export GRADLE_USER_HOME="$RUNNER_TEMP/tailvnc-gradle-home"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_SDK_ROOT="$ANDROID_SDK_ROOT"
          mkdir -p "$GRADLE_USER_HOME"
          cd avnc
          ../gradle-9.5.0/bin/gradle --no-daemon --refresh-dependencies :app:testDebugUnitTest :app:assembleDebug
      - name: Freeze complete portable acquisition cache
        shell: bash
        run: |
          set -euo pipefail
          export GRADLE_USER_HOME="$RUNNER_TEMP/tailvnc-gradle-home"
          mkdir -p stage/cache/gradle stage/cache/vcpkg stage/out
          cp -a "$GRADLE_USER_HOME/caches/modules-2" stage/cache/gradle/
          cp -a avnc/extern/vcpkg/downloads stage/cache/vcpkg/ 2>/dev/null || true
          cp -a avnc/extern/vcpkg/vcpkg stage/cache/vcpkg/ 2>/dev/null || true
          if [ -d "$HOME/.cache/vcpkg/archives" ]; then mkdir -p stage/cache/vcpkg/binary-cache; cp -a "$HOME/.cache/vcpkg/archives" stage/cache/vcpkg/binary-cache/; fi
          find avnc -path '*/vcpkg_installed' -type d -prune -print > stage/vcpkg-installed-locations.txt || true
          printf 'AVNC=1e209d630d106d1901f6d8bec671da6c41c2f18a\nLIBVNC=cc4be40b5b5a9327974d1eeb52f445db44abf801\nVCPKG=e2bafb1c06518df2e996a2028bdea86f9736d5cb\n' > stage/PROVENANCE.txt
          tar -C stage --zstd -cf stage/out/tailvnc-offline-cache.tar.zst cache PROVENANCE.txt vcpkg-installed-locations.txt
          sha256sum stage/out/tailvnc-offline-cache.tar.zst | tee stage/out/SHA256SUMS.txt
          split -d -a 2 -b 80M stage/out/tailvnc-offline-cache.tar.zst stage/out/part-
          rm stage/out/tailvnc-offline-cache.tar.zst
          ls -lh stage/out
      - name: Upload parts 00-05
        shell: bash
        run: |
          true
      - name: Upload part 00
        if: ${{ hashFiles('stage/out/part-00') != '' }}
        uses: actions/upload-artifact@v4
        with: { name: tailvnc-offline-part-00, path: stage/out/part-00, retention-days: 7 }
      - name: Upload part 01
        if: ${{ hashFiles('stage/out/part-01') != '' }}
        uses: actions/upload-artifact@v4
        with: { name: tailvnc-offline-part-01, path: stage/out/part-01, retention-days: 7 }
      - name: Upload part 02
        if: ${{ hashFiles('stage/out/part-02') != '' }}
        uses: actions/upload-artifact@v4
        with: { name: tailvnc-offline-part-02, path: stage/out/part-02, retention-days: 7 }
      - name: Upload part 03
        if: ${{ hashFiles('stage/out/part-03') != '' }}
        uses: actions/upload-artifact@v4
        with: { name: tailvnc-offline-part-03, path: stage/out/part-03, retention-days: 7 }
      - name: Upload part 04
        if: ${{ hashFiles('stage/out/part-04') != '' }}
        uses: actions/upload-artifact@v4
        with: { name: tailvnc-offline-part-04, path: stage/out/part-04, retention-days: 7 }
      - name: Upload part 05
        if: ${{ hashFiles('stage/out/part-05') != '' }}
        uses: actions/upload-artifact@v4
        with: { name: tailvnc-offline-part-05, path: stage/out/part-05, retention-days: 7 }
      - name: Upload part 06
        if: ${{ hashFiles('stage/out/part-06') != '' }}
        uses: actions/upload-artifact@v4
        with: { name: tailvnc-offline-part-06, path: stage/out/part-06, retention-days: 7 }
      - name: Upload part 07
        if: ${{ hashFiles('stage/out/part-07') != '' }}
        uses: actions/upload-artifact@v4
        with: { name: tailvnc-offline-part-07, path: stage/out/part-07, retention-days: 7 }
      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with: { name: tailvnc-offline-manifest, path: stage/out/SHA256SUMS.txt, retention-days: 7 }

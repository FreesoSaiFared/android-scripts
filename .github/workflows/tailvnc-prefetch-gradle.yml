name: TailVNC prefetch Gradle dependencies

on:
  push:
    branches:
      - tf-tailvnc-gradle-cache-20260928

permissions:
  contents: read

jobs:
  prefetch:
    runs-on: ubuntu-latest
    steps:
      - name: Materialize exact AVNC source and native donor trees
        shell: bash
        run: |
          set -euo pipefail
          AVNC_SHA=1e209d630d106d1901f6d8bec671da6c41c2f18a
          LIBVNC_SHA=cc4be40b5b5a9327974d1eeb52f445db44abf801
          VCPKG_SHA=e2bafb1c06518df2e996a2028bdea86f9736d5cb
          curl -fL --retry 3 "https://codeload.github.com/gujjwal00/avnc/zip/${AVNC_SHA}" -o avnc.zip
          unzip -q avnc.zip
          mv "avnc-${AVNC_SHA}" avnc
          mkdir -p avnc/extern
          curl -fL --retry 3 "https://codeload.github.com/gujjwal00/libvncserver/zip/${LIBVNC_SHA}" -o libvnc.zip
          unzip -q libvnc.zip
          rm -rf avnc/extern/libvncserver
          mv "libvncserver-${LIBVNC_SHA}" avnc/extern/libvncserver
          curl -fL --retry 3 "https://codeload.github.com/gujjwal00/vcpkg/zip/${VCPKG_SHA}" -o vcpkg.zip
          unzip -q vcpkg.zip
          rm -rf avnc/extern/vcpkg
          mv "vcpkg-${VCPKG_SHA}" avnc/extern/vcpkg
      - name: Install exact Android SDK requirements
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT" -type f -name sdkmanager -perm -u+x | head -1)"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Resolve all Gradle plugins and Java/Kotlin dependencies
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://services.gradle.org/distributions/gradle-9.5.0-bin.zip -o gradle.zip
          unzip -q gradle.zip
          cd avnc
          export ANDROID_SDK_ROOT="$ANDROID_SDK_ROOT"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          ../gradle-9.5.0/bin/gradle --no-daemon --refresh-dependencies help
          ../gradle-9.5.0/bin/gradle --no-daemon --refresh-dependencies :app:dependencies
      - name: Freeze portable Gradle dependency cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/cache
          cp -a "$HOME/.gradle/caches/modules-2" out/cache/
          cp -a "$HOME/.gradle/caches/jars-9" out/cache/ 2>/dev/null || true
          cp -a "$HOME/.gradle/caches/transforms-4" out/cache/ 2>/dev/null || true
          tar -C out -cf out/gradle-cache.tar cache
          sha256sum out/gradle-cache.tar | tee out/SHA256SUMS.txt
          split -d -a 2 -b 80M out/gradle-cache.tar out/part-
          rm out/gradle-cache.tar
          ls -lh out/part-* out/SHA256SUMS.txt
      - name: Upload part 00
        if: ${{ hashFiles('out/part-00') != '' }}
        uses: actions/upload-artifact@v4
        with: { name: tailvnc-gradle-part-00, path: out/part-00, retention-days: 7 }
      - name: Upload part 01
        if: ${{ hashFiles('out/part-01') != '' }}
        uses: actions/upload-artifact@v4
        with: { name: tailvnc-gradle-part-01, path: out/part-01, retention-days: 7 }
      - name: Upload part 02
        if: ${{ hashFiles('out/part-02') != '' }}
        uses: actions/upload-artifact@v4
        with: { name: tailvnc-gradle-part-02, path: out/part-02, retention-days: 7 }
      - name: Upload part 03
        if: ${{ hashFiles('out/part-03') != '' }}
        uses: actions/upload-artifact@v4
        with: { name: tailvnc-gradle-part-03, path: out/part-03, retention-days: 7 }
      - name: Upload part 04
        if: ${{ hashFiles('out/part-04') != '' }}
        uses: actions/upload-artifact@v4
        with: { name: tailvnc-gradle-part-04, path: out/part-04, retention-days: 7 }
      - name: Upload part 05
        if: ${{ hashFiles('out/part-05') != '' }}
        uses: actions/upload-artifact@v4
        with: { name: tailvnc-gradle-part-05, path: out/part-05, retention-days: 7 }
      - name: Upload part 06
        if: ${{ hashFiles('out/part-06') != '' }}
        uses: actions/upload-artifact@v4
        with: { name: tailvnc-gradle-part-06, path: out/part-06, retention-days: 7 }
      - name: Upload part 07
        if: ${{ hashFiles('out/part-07') != '' }}
        uses: actions/upload-artifact@v4
        with: { name: tailvnc-gradle-part-07, path: out/part-07, retention-days: 7 }
      - name: Upload part 08
        if: ${{ hashFiles('out/part-08') != '' }}
        uses: actions/upload-artifact@v4
        with: { name: tailvnc-gradle-part-08, path: out/part-08, retention-days: 7 }
      - name: Upload part 09
        if: ${{ hashFiles('out/part-09') != '' }}
        uses: actions/upload-artifact@v4
        with: { name: tailvnc-gradle-part-09, path: out/part-09, retention-days: 7 }
      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with: { name: tailvnc-gradle-manifest, path: out/SHA256SUMS.txt, retention-days: 7 }

name: TailVNC acquire pinned native donors

on:
  push:
    branches:
      - tf-tailvnc-acquisition-20260928

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact AVNC native donor archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          LIBVNC_SHA=cc4be40b5b5a9327974d1eeb52f445db44abf801
          VCPKG_SHA=e2bafb1c06518df2e996a2028bdea86f9736d5cb
          curl -fL --retry 3 "https://codeload.github.com/gujjwal00/libvncserver/zip/${LIBVNC_SHA}" -o "out/libvncserver-${LIBVNC_SHA}.zip"
          curl -fL --retry 3 "https://codeload.github.com/gujjwal00/vcpkg/zip/${VCPKG_SHA}" -o "out/vcpkg-${VCPKG_SHA}.zip"
          sha256sum out/*.zip | tee out/SHA256SUMS.txt
          unzip -t "out/libvncserver-${LIBVNC_SHA}.zip" | tail -3
          unzip -t "out/vcpkg-${VCPKG_SHA}.zip" | tail -3
      - name: Upload donor archives
        uses: actions/upload-artifact@v4
        with:
          name: tailvnc-native-donors
          path: out/
          if-no-files-found: error
          retention-days: 7
